<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三维目标身份实验</title><style>body{font:16px/1.5 sans-serif;max-width:1100px;margin:auto;background:#f4f7fa;color:#14263a;padding:20px}article{border:1px solid #c9d5df;border-radius:8px;background:white;padding:16px;margin:18px 0}canvas{width:100%;max-width:960px;height:auto;border:1px solid #6f8194;touch-action:none;cursor:grab}button{padding:6px 12px;margin-right:8px}.formal{color:#0272bd}.aux{color:#a77400}.unassigned{color:#56606c}.neighbor{color:#9c2196}.warning{background:#fff3d2;padding:10px}code{font-size:14px}</style></head><body><h1>正式目标与辅助候选的三维点云</h1><p class="warning">单帧 LiDAR 坐标，拖动画面旋转，滚轮缩放。点只按算法阶段上色：蓝色正式已选、黄色辅助几何簇、灰色辅助未选、紫色另一辅助候选未选。黄色簇尚未确认身份；无点不等于不存在车辆。语义真值未用于聚类或身份判断。</p><main id="main">正在加载……</main><script>
const main=document.querySelector('#main');const colors={formal:'#44b8ff',aux_cluster:'#ffd84a',aux_unselected:'#d0d4d9',neighbor_aux_unselected:'#fa6bed'};const names={formal:'正式已选',aux_cluster:'辅助几何簇（未确认）',aux_unselected:'辅助未选',neighbor_aux_unselected:'其他辅助候选未选'};
function label(parent,tag,text){const e=document.createElement(tag);e.textContent=text;parent.appendChild(e);return e}
fetch('visualization.json').then(r=>r.json()).then(data=>{main.replaceChildren();data.forEach(scene=>{let card=document.createElement('article');label(card,'h2',scene.case+'　半径 '+scene.radius_m+' m');label(card,'p',scene.formal_exists?'本帧有正式目标；蓝点与黄色几何簇不共用原始点。':'本帧没有 0.35 正式目标；紫色是另一辅助候选，不是正式目标。');let canvas=document.createElement('canvas');canvas.width=960;canvas.height=560;card.appendChild(canvas);let state={yaw:.65,pitch:.45,scale:1,drag:false};const ctx=canvas.getContext('2d');let pts=scene.points,center=[0,0,0];pts.forEach(p=>p.xyz.forEach((x,k)=>center[k]+=x/pts.length));let range=Math.max(...pts.flatMap(p=>p.xyz.map((x,k)=>Math.abs(x-center[k]))),1);
function project(x){let p=x.map((q,k)=>q-center[k]);let a=p[0]*Math.cos(state.yaw)-p[1]*Math.sin(state.yaw),b=p[0]*Math.sin(state.yaw)+p[1]*Math.cos(state.yaw),c=p[2];return [480+a/range*180*state.scale,280+(-c*Math.cos(state.pitch)+b*Math.sin(state.pitch))/range*180*state.scale,b*Math.cos(state.pitch)+c*Math.sin(state.pitch)]}
function draw(){ctx.fillStyle='#142334';ctx.fillRect(0,0,960,560);ctx.font='16px sans-serif';ctx.fillStyle='white';ctx.fillText('LiDAR 坐标轴：X 前向 / Y 横向 / Z 上下；围绕数据中心旋转',18,26);let projected=pts.map(p=>({p,q:project(p.xyz)})).sort((a,b)=>a.q[2]-b.q[2]);projected.forEach(({p,q})=>{ctx.beginPath();ctx.arc(q[0],q[1],8,0,2*Math.PI);ctx.fillStyle=colors[p.group];ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();});ctx.fillStyle='white';ctx.fillText('共 '+pts.length+' 点；点大小只为显示，不代表物理尺寸',18,540)}draw();canvas.addEventListener('pointerdown',e=>{state.drag=true;state.x=e.clientX;state.y=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!state.drag)return;state.yaw+=(e.clientX-state.x)*.01;state.pitch=Math.max(-1.4,Math.min(1.4,state.pitch+(e.clientY-state.y)*.01));state.x=e.clientX;state.y=e.clientY;draw()});canvas.addEventListener('pointerup',()=>state.drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.5,Math.min(4,state.scale*Math.exp(-e.deltaY*.001)));draw()},{passive:false});let counts={};pts.forEach(p=>counts[p.group]=(counts[p.group]||0)+1);Object.entries(counts).forEach(([group,n])=>label(card,'p',names[group]+'：'+n+' 点'));let d=scene.decision;label(card,'p','模块状态：'+d.status+'；原因：'+d.reasons.join('、'));if(d.current.nearest_3d_points_m!==undefined)label(card,'p','两簇最近三维点距：'+d.current.nearest_3d_points_m.toFixed(3)+' m；径向距离区间间隔：'+d.current.radial_interval_gap_m.toFixed(3)+' m。');label(card,'p','语义标签仅在独立的 offline_audit.json 和 point_ownership.csv 中用于离线核验，本图颜色并非真实身份标签。');main.appendChild(card)})}).catch(e=>main.textContent='加载失败：'+e.message);
</script></body></html>
