config_id: a3-b1-closeout-robust-fp32-v3-smoke
seed: 20261006

teacher:
  git_sha: MULTI_GOVERNED_B1_CLOSEOUT_V1
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  artifact_fingerprint_sha256: 4bbf183b7b7f1ab9fb9eb325f189f4449d65e9fe664cbfe4bcc58a33888657fa
  identity_policy: b1_closeout_cumulative_smoke

contract: {max_steps: 4, max_targets: 8}

dataset:
  version: b1_governed_closeout_v1_a3_strict_positive_v1
  train_path: artifacts/a3_b1_closeout_positive_view_v1/train.jsonl
  val_path: artifacts/a3_b1_closeout_positive_view_v1/val.jsonl
  view_manifest_path: artifacts/a3_b1_closeout_positive_view_v1/a3_closeout_view_manifest.json
  d2_release_dir_path: challenge/dataset/releases/d2_v1_1
  d3_wave1_release_dir_path: challenge/dataset/releases/d3_wave1_addon_v1
  d3_wave2_release_dir_path: challenge/dataset/releases/d3_wave2_safe_short_v1
  targeted_gap_release_dir_path: challenge/dataset/releases/d3_targeted_gap_strict_v1
  turn_gap_release_dir_path: challenge/dataset/releases/d3_turn_gap_60_strict_v1
  gap300_release_dir_path: challenge/dataset/releases/d3_gap300_strict_v1
  ms34_release_dir_path: challenge/dataset/releases/b1_ms34_supplement_v1
  b1_closeout_dir_path: challenge/dataset/governance/b1_closeout_v1
  asset_root: .
  require_rgb: true
  verify_teacher_identity: true
  require_pinned_teacher_provenance: true

model:
  model_id: student-v0-r3-fp32
  config_id: student-v0-r3-structure-20260911
  factory: challenge.distillation.a1_student:build_a1_student
  options: {}

input:
  factory: challenge.distillation.a1_student:build_a1_input_packer
  options: {}

training:
  device: auto
  epochs: 1
  batch_size: 8
  learning_rate: 0.00008
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  max_updates: 2
  selection_metric: plan_sequence_accuracy
  selection_tiebreakers:
    - {metric: behavior_accuracy, mode: max}
    - {metric: loss, mode: min}
    - {metric: target_speed_mae, mode: min}
  resume: null

training_input_augmentation:
  enabled: true
  text_full_dropout_probability: 0.35
  text_token_dropout_probability: 0.15
  rgb_dropout_probability: 0.10

sampling:
  weights: {normal: 1.0, complex: 1.5, safety_critical: 2.5}

class_balance:
  enabled: true
  heads: [behavior, plan_length]
  smoothing: 1.0
  max_weight: 8.0

loss_weights:
  behavior: 3.0
  target_pointer: 1.5
  target_lane: 0.5
  target_speed: 0.5
  completion: 0.5
  on_failure: 0.3
  confidence: 0.2
  replan: 0.2
  plan_length: 2.0
  requires_confirmation: 0.2

distillation: {soft_alpha: 0.0, temperature: 1.0}
output: {directory: artifacts/challenge/distillation/a3_b1_closeout_robust_fp32_v3_smoke}
